name: Release System Version

on:
  push:
    tags:
      - "v*.*.*"
  # auto-review.yml explicitly dispatches this workflow because a tag pushed with
  # GITHUB_TOKEN does not cascade-trigger workflows. It passes the tag as an input
  # and dispatches on the default branch (whose workflow definition always has the
  # trigger). `tag` falls back to github.ref_name for the tag-push trigger.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (git tag must already exist)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: latest
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: "pnpm"
      - run: pnpm i
      - run: pnpm run build
      # create a release with the tag name and the build artifacts (./dist/icon_map.sh and ./dist/sketchybar-app-font.ttf)
      # the description should be the commitlog since the last tag
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${GITHUB_REPOSITORY#*/} v${tag#v}" \
              --generate-notes
          gh release upload "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --clobber \
              ./dist/icon_map.sh \
              ./dist/sketchybar-app-font.ttf \
              ./dist/icon_map.lua \
              ./dist/icon_map.json
